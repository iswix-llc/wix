name: Publish IsWiX packages

# Mirrors IsWiX.WindowsInstaller's publish workflow: run by hand, pick a version bump, build and test,
# sign with Azure Artifact Signing (ISWIX-LLC / IsWiX), push to nuget.org with trusted publishing,
# then push the release tag.
#
# Always run it from main ("Use workflow from: main"); pick the branch to release with the `branch` input.
# That keeps the Azure federated credential (subject: main) the same for every release.
#
# The version comes from git tags (SomeVer): this workflow tags the branch HEAD locally before building,
# so the build is versioned exactly as the release. Every IsWiX release is recorded as an iswix-vX.Y.Z tag;
# a plain vX.Y.Z tag is also pushed unless upstream WiX already owns that tag (e.g. v7.0.1, reproduced from
# release/v7). Tags are pushed only after the packages are on nuget.org, so a failed run can be re-run.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and release
        type: choice
        options:
          - main
          - release/v7
        default: main
      bump:
        description: Which part of the version to increment (from the latest release tag on that branch); ignored when version is set
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: Exact version to release instead of a bump, e.g. 7.0.1 (optional)
        type: string
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  # Packages built but deliberately not published. IsWiX.Bal.wixext is upstream's compatibility shim
  # for the old WixToolset.Bal.wixext id, which no IsWiX user would reference.
  UNPUBLISHED_PACKAGES: IsWiX.Bal.wixext

jobs:
  publish:
    # WiX v7 builds with VS2022 (v143); main (v8) needs the VS2026 image.
    runs-on: ${{ inputs.branch == 'release/v7' && 'windows-2022' || 'windows-2025-vs2026' }}
    timeout-minutes: 300
    steps:
      - name: Check out ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0 # SomeVer needs the tags and history to compute the version.

      - name: Install sign CLI tool
        shell: cmd
        run: dotnet tool install --tool-path build\.tools sign --version 0.9.1-beta.26528.1

      - name: Configure automated logging and crash dumps
        shell: cmd
        run: |
          reg add HKLM\Software\Policies\Microsoft\Windows\Installer /t REG_SZ /v Logging /d voicewarmupx /f
          reg add HKLM\Software\WOW6432Node\Policies\Microsoft\Windows\Installer /t REG_SZ /v Logging /d voicewarmupx /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_EXPAND_SZ /v DumpFolder /d "%CD%\build\logs\crashdumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpCount /d 10 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpType /d 1 /f
          reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_EXPAND_SZ /v DumpFolder /d "%CD%\build\logs\crashdumps" /f
          reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpCount /d 10 /f
          reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpType /d 1

      - name: Choose and tag the release version
        id: version
        shell: pwsh
        env:
          BRANCH: ${{ inputs.branch }}
          BUMP: ${{ inputs.bump }}
          EXACT_VERSION: ${{ inputs.version }}
        run: |
          function Get-ReleaseVersions([string[]] $tags) {
            foreach ($t in $tags) { if ($t -match '^(?:iswix-)?v(\d+\.\d+\.\d+)$') { [version]$Matches[1] } }
          }
          $allTags = @(git tag --list 'v*') + @(git tag --list 'iswix-v*')
          $branchTags = @(git tag --list 'v*' --merged HEAD) + @(git tag --list 'iswix-v*' --merged HEAD)
          $latestOnBranch = Get-ReleaseVersions $branchTags | Sort-Object -Descending | Select-Object -First 1
          if (-not $latestOnBranch) {
            throw 'No vX.Y.Z release tags in this branch''s history. Push the upstream WiX tags first: git fetch upstream --tags; git push origin --tags'
          }

          if ($env:EXACT_VERSION) {
            if ($env:EXACT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "version must look like 7.0.1, not '$($env:EXACT_VERSION)'." }
            $new = [version]$env:EXACT_VERSION
          } else {
            $major = $latestOnBranch.Major; $minor = $latestOnBranch.Minor; $patch = $latestOnBranch.Build
            switch ($env:BUMP) {
              'major' { $major++; $minor = 0; $patch = 0 }
              'minor' { $minor++; $patch = 0 }
              'patch' { $patch++ }
            }
            $new = [version]"$major.$minor.$patch"
          }
          $v = "$($new.Major).$($new.Minor).$($new.Build)"
          $tag = "v$v"
          $recordTag = "iswix-v$v"

          # A release/vN branch only releases N.x versions.
          if ($env:BRANCH -match '^release/v(\d+)$' -and $new.Major -ne [int]$Matches[1]) {
            throw "$env:BRANCH releases $($Matches[1]).x versions, not $v."
          }
          # main is always ahead of every maintained release/vN branch (release/v7 exists, so main releases 8.x+).
          if ($env:BRANCH -eq 'main') {
            $branchMajors = git ls-remote --heads origin 'refs/heads/release/v*' | ForEach-Object { if ($_ -match 'refs/heads/release/v(\d+)$') { [int]$Matches[1] } }
            $highestReleaseBranch = $branchMajors | Sort-Object -Descending | Select-Object -First 1
            if ($highestReleaseBranch -and $new.Major -le $highestReleaseBranch) {
              throw "main releases versions above release/v$highestReleaseBranch, not $v. Choose 'major' for the first v$($highestReleaseBranch + 1) release."
            }
          }
          # Already published by IsWiX?
          if (git ls-remote --tags origin "refs/tags/$recordTag") { throw "$recordTag already exists: IsWiX $v was already published." }
          # Must be newer than every existing release with the same major, unless it reproduces an upstream
          # release this branch is built on (e.g. v7.0.1 on release/v7).
          $upstreamReproduction = ($branchTags -contains $tag)
          $sameMajorLatest = Get-ReleaseVersions $allTags | Where-Object { $_.Major -eq $new.Major } | Sort-Object -Descending | Select-Object -First 1
          if (-not $upstreamReproduction -and $sameMajorLatest -and $new -le $sameMajorLatest) {
            throw "$v is not newer than existing release $sameMajorLatest. Choose a bigger bump (the first v8 release from main needs 'major')."
          }

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Local tag at HEAD for SomeVer; -f moves a fetched upstream tag of the same name (local only).
          git tag -f -a $tag -m "IsWiX release $v"
          if ($LASTEXITCODE -ne 0) { throw "Tagging $tag failed." }
          git tag -a $recordTag -m "IsWiX release $v"
          if ($LASTEXITCODE -ne 0) { throw "Tagging $recordTag failed." }
          $pushVersionTag = -not (git ls-remote --tags origin "refs/tags/$tag")

          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "record_tag=$recordTag" >> $env:GITHUB_OUTPUT
          "push_version_tag=$($pushVersionTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Branch $env:BRANCH; latest release in its history: $latestOnBranch; publishing $v"
          if (-not $pushVersionTag) { Write-Host "$tag already exists on origin (upstream WiX); recording this release as $recordTag only." }

      - name: Sign in to Azure (federated identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Signing happens inside the build (binaries, MSIs, bundle engines and bundles) through
      # src/Directory.Build.targets; MSBuild reads these environment variables as properties.
      # Build logs are not uploaded: binlogs capture environment variables, including the OIDC token request values.
      - name: Build, test and sign
        shell: cmd
        run: ./src/build_official.cmd
        env:
          RuntimeTestsEnabled: true
          SigningArtifactAccount: ISWIX-LLC
          SigningArtifactCertificateProfile: IsWiX
          SigningArtifactEndpoint: https://eus.codesigning.azure.net/

      - name: Verify the version and signatures
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $sdk = "build/artifacts/IsWiX.Sdk.$v.nupkg"
          if (-not (Test-Path $sdk)) {
            Get-ChildItem build/artifacts -Filter 'IsWiX.Sdk.*.nupkg' | ForEach-Object { Write-Host "Found $($_.Name)" }
            throw "Expected $sdk; the build did not pick up the $v version."
          }
          # Every WiX managed assembly is signed as it builds; check the ones that ship in the CLI tool and SDK,
          # including each publish project's own assembly (wix.dll, WixToolset.Sdk.dll, WixToolset.BuildTasks.dll).
          $publish = 'build/wix/Release/publish'
          $ours = Get-ChildItem $publish -Recurse -Include 'WixToolset.*.dll','wix.dll'
          if (-not $ours) { throw "No WixToolset.*.dll or wix.dll files found under $publish." }
          $bad = foreach ($file in $ours) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid') { "$($file.FullName): $($sig.Status) $($sig.StatusMessage)" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host $_ }; throw 'Some binaries are not validly signed.' }
          $signer = (Get-AuthenticodeSignature $ours[0].FullName).SignerCertificate.Subject
          Write-Host "$($ours.Count) binaries validly signed by: $signer"
      
      - name: Get a short-lived NuGet key (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $suffix = ".$v.nupkg"
          $skip = $env:UNPUBLISHED_PACKAGES -split '[;,\s]+' | Where-Object { $_ }
          $packages = Get-ChildItem build/artifacts -Filter "*$suffix" | Where-Object {
            $id = $_.Name.Substring(0, $_.Name.Length - $suffix.Length)
            ($id -like 'IsWiX.*' -or $id -eq 'iswix') -and -not ($skip -contains $id)
          }
          if (-not $packages) { throw "No IsWiX packages for $v found in build/artifacts." }
          foreach ($package in $packages) {
            Write-Host "Pushing $($package.Name)"
            dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Pushing $($package.Name) failed." }
          }
          Write-Host "Published $($packages.Count) packages."

      - name: Push the release tags
        shell: pwsh
        run: |
          $refs = @("refs/tags/${{ steps.version.outputs.record_tag }}")
          if ('${{ steps.version.outputs.push_version_tag }}' -eq 'true') { $refs += "refs/tags/${{ steps.version.outputs.tag }}" }
          git push --atomic origin @refs
          if ($LASTEXITCODE -ne 0) { throw "Pushing $($refs -join ', ') failed." }
          Write-Host "Pushed $($refs -join ', ')"
